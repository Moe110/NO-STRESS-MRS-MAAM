<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arwa’s Big Full House</title>
<style>
:root{color-scheme:dark;--bg:#0b0a10;--panel:rgba(35,29,48,.9);--ink:#f3f0ea;--accent:#8b5cf6;--line:#5b4a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#stage{position:fixed;inset:0}canvas{display:block;touch-action:none}
.top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:center;flex-wrap:wrap;gap:6px;z-index:5;padding:0 8px}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:6px 12px;font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{background:var(--accent)}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 210px));min-width:200px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 16px;text-align:center;font-size:14px;line-height:1.4;z-index:5}
.acts{display:flex;gap:6px;justify-content:center;margin-top:8px}
#act,#act2{display:none;background:var(--accent);font-weight:700}#act{animation:p 1.4s infinite}
@keyframes p{50%{transform:scale(1.05)}}
.pad{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px;z-index:6}
.pad button{padding:0;font-size:18px;user-select:none;touch-action:none}
.u{grid-column:2;grid-row:1}.l{grid-column:1;grid-row:2}.d{grid-column:2;grid-row:2}.r{grid-column:3;grid-row:2}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s;z-index:9}
#hold{position:fixed;top:calc(52px + env(safe-area-inset-top,0px));left:12px;z-index:5;font-size:13px;background:var(--panel);border-radius:12px;padding:0 10px;line-height:28px}#hold:empty{display:none}
#mini{position:fixed;right:10px;top:calc(48px + env(safe-area-inset-top,0px));width:100px;height:100px;border-radius:50%;border:2px solid var(--accent);z-index:4;opacity:.92}
#drive{display:none;position:fixed;inset:0;pointer-events:none;z-index:7}
body.drv #drive{display:block}body.drv .pad{display:none}body.drv #msg{bottom:auto;top:calc(56px + env(safe-area-inset-top,0px));width:min(520px,calc(100% - 140px))}
#wheel{pointer-events:auto;position:absolute;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:130px;height:130px;border-radius:50%;border:14px solid #2a2d36;box-sizing:border-box;touch-action:none;background:radial-gradient(circle,#3b3f4c 0 20%,rgba(0,0,0,.25) 21%)}
#wheel:before,#wheel:after{content:'';position:absolute;background:#2a2d36}
#wheel:before{left:0;right:0;top:calc(50% - 5px);height:10px}#wheel:after{left:calc(50% - 5px);width:10px;top:50%;bottom:0}
#wheel i{position:absolute;left:calc(50% - 6px);top:-14px;width:12px;height:14px;background:#ef4444;border-radius:3px}
.pedals{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
#pGas{width:64px;height:120px;border-radius:12px;background:#166534;border-color:#22c55e}#pBrake{width:86px;height:70px;border-radius:12px;background:#7f1d1d;border-color:#ef4444}
.pedals button,.dbtns button{touch-action:none;user-select:none}
.dbtns{position:absolute;right:14px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;pointer-events:auto}
#game{display:none;position:fixed;inset:0;background:rgba(5,4,10,.85);z-index:20;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 8px env(safe-area-inset-bottom,0px)}
.gbox{background:#1c1730;border:2px solid var(--accent);border-radius:18px;padding:12px;width:min(380px,100%);max-height:100%;overflow:auto;text-align:center}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
#gc{width:100%;max-width:360px;border-radius:12px;touch-action:none;background:#0f0b1f}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{height:72px;font-size:30px;padding:0}.card.done{background:#166534;border-color:#22c55e}
@media(max-width:620px){#msg{left:12px;transform:none;width:calc(100% - 220px);font-size:12px;padding:9px 11px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="stage"></div><div id="flash"></div>
<div class="top"><button id="bLight">💡 lights</button><button id="bHome">🏠 my room</button><button id="bDance">💃 dance</button><button id="bPhoto">📸 photo</button><button id="bDrop" style="display:none">✋ drop (Q)</button></div><div id="hold"></div><canvas id="mini" width="140" height="140"></canvas>
<div id="drive"><div id="wheel"><i></i></div><div class="dbtns"><button id="bView">🎥 view</button><button id="bRadio">📻 radio</button></div><div class="pedals"><button id="pBrake">brake</button><button id="pGas">gas</button></div></div>
<div id="game"><div class="gbox"><div class="ghead"><b id="gtitle"></b><span id="gscore"></span><button id="gclose">✕ close</button></div><canvas id="gc" width="360" height="480"></canvas><div id="gbody"></div></div></div>
<div id="msg"><div id="txt">welcome home, Arwa. walk around, meet the pets and explore. your room is the door with your name on it</div>
<div class="acts"><button id="act"></button><button id="act2"></button></div></div>
<div class="pad"><button class="u" data-k="w">▲</button><button class="l" data-k="a">◀</button><button class="d" data-k="s">▼</button><button class="r" data-k="d">▶</button></div>
<script>
const NAME="Arwa";
const R=Math.random,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),pick=a=>a[Math.floor(R()*a.length)];
const scene=new THREE.Scene();scene.background=new THREE.Color(0x15121d);
const camera=new THREE.PerspectiveCamera(45,1,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);
const amb=new THREE.HemisphereLight(0xfff6ea,0x6b5a7a,.8);scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff0d8,.9);sun.position.set(8,16,9);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;const sc=sun.shadow.camera;sc.left=-18;sc.right=18;sc.top=18;sc.bottom=-18;sc.far=60;scene.add(sun);

/* ---------- procedural texture mapping ---------- */
function tex(w,h,draw,rx,ry,srgb){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.anisotropy=8;if(srgb!==false)t.encoding=THREE.sRGBEncoding;return t}
const speck=(g,w,h,n,a)=>{for(let i=0;i<n;i++){g.fillStyle=`rgba(${R()<.5?0:255},${R()<.5?0:255},${R()<.5?0:255},${a})`;g.fillRect(R()*w,R()*h,1+R()*2,1+R()*2)}};
function wood(base,rx,ry){const T=tex(512,512,(g,w,h)=>{const n=8;for(let i=0;i<n;i++){const l=base+(R()-.5)*12;g.fillStyle=`hsl(28,${38+R()*10}%,${l}%)`;g.fillRect(0,i*h/n,w,h/n);
 for(let k=0;k<40;k++){g.strokeStyle=`rgba(60,30,10,${.05+R()*.1})`;g.beginPath();const y=i*h/n+R()*h/n;g.moveTo(0,y);for(let x=0;x<=w;x+=32)g.lineTo(x,y+Math.sin(x*.03+k)*1.8);g.stroke()}
 g.fillStyle='rgba(30,15,5,.55)';g.fillRect(0,i*h/n,w,2)}for(let i=0;i<3;i++){g.fillRect(R()*w,0,2,h)}},rx,ry);return T}
const tileT=(rx,ry)=>tex(256,256,(g,w,h)=>{g.fillStyle='#8e949c';g.fillRect(0,0,w,h);for(let i=0;i<2;i++)for(let j=0;j<2;j++){g.fillStyle=`hsl(215,8%,${80+R()*6}%)`;g.fillRect(i*128+3,j*128+3,122,122)}speck(g,w,h,400,.04)},rx,ry);
const fabC={};function fabric(c){if(fabC[c])return fabC[c];const col=new THREE.Color(c).getStyle();
 return fabC[c]=tex(128,128,(g,w,h)=>{g.fillStyle=col;g.fillRect(0,0,w,h);for(let i=0;i<w;i+=3){g.fillStyle='rgba(0,0,0,.09)';g.fillRect(i,0,1,h);g.fillStyle='rgba(255,255,255,.06)';g.fillRect(0,i,w,1)}speck(g,w,h,300,.05)},2,2)}
const carpetT=(c,rx,ry)=>tex(256,256,(g,w,h)=>{g.fillStyle=c;g.fillRect(0,0,w,h);speck(g,w,h,2500,.07)},rx,ry);
const paperT=tex(256,256,(g,w,h)=>{g.fillStyle='#e8e2f0';g.fillRect(0,0,w,h);for(let x=0;x<w;x+=32){g.fillStyle='rgba(120,100,160,.12)';g.fillRect(x,0,14,h)}speck(g,w,h,500,.03)},5,1);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o||{}));
const FAB=c=>M(0xffffff,{map:fabric(c),roughness:.95});
const WOOD=(b,rx,ry,o)=>{const t=wood(b,rx,ry);return M(0xffffff,Object.assign({map:t,bumpMap:t,bumpScale:.8,roughness:.55},o||{}))};

/* ---------- sculpted geometry ---------- */
function rgeo(w,h,d,r){r=Math.min(r,w/2,h/2,d/2);const g=new THREE.BoxGeometry(w,h,d,8,8,8),p=g.attributes.position,hx=w/2-r,hy=h/2-r,hz=d/2-r;
 for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),ix=clamp(x,-hx,hx),iy=clamp(y,-hy,hy),iz=clamp(z,-hz,hz),dx=x-ix,dy=y-iy,dz=z-iz,l=Math.hypot(dx,dy,dz)||1;p.setXYZ(i,ix+dx/l*r,iy+dy/l*r,iz+dz/l*r)}
 g.computeVertexNormals();return g}
const colliders=[];
function box(cx,cz,w,d,h,c,o){o=o||{};const y=o.y||0;const m=new THREE.Mesh(o.r?rgeo(w,h,d,o.r):new THREE.BoxGeometry(w,h,d),o.mat||M(c,o.m));
 m.position.set(cx,y+h/2,cz);m.castShadow=true;m.receiveShadow=true;scene.add(m);
 if(o.solid!==false&&!o.y)colliders.push({x1:cx-w/2-.25,x2:cx+w/2+.25,z1:cz-d/2-.25,z2:cz+d/2+.25});return m}
function lathe(pts,x,y,z,mat){const m=new THREE.Mesh(new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),24),mat);m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m}
function ball(x,y,z,r,c,o){const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),M(c,o));m.position.set(x,y,z);m.castShadow=true;scene.add(m);return m}
function plane(cx,cz,w,d,mat,y){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);m.rotation.x=-Math.PI/2;m.position.set(cx,y,cz);m.receiveShadow=true;scene.add(m);return m}
const wallMat=M(0xffffff,{map:paperT,roughness:.9});
function wall(x1,z1,x2,z2,h){return box((x1+x2)/2,(z1+z2)/2,Math.abs(x2-x1)||.2,Math.abs(z2-z1)||.2,h||2.6,0,{mat:wallMat})}
function leafPlant(x,z,pot,s){lathe([[.001,0],[.28,0],[.34,.5],[.38,.55],[.3,.55],[.001,.52]],x,0,z,M(pot,{roughness:.6}));const g=new THREE.Group();
 for(let i=0;i<22;i++){const l=new THREE.Mesh(new THREE.SphereGeometry(.2,10,8),M(new THREE.Color().setHSL(.3+R()*.06,.6,.25+R()*.12),{roughness:.6}));l.scale.set(.35,.08,1);
  const a=i*2.4,t=.3+R()*.9;l.position.set(Math.cos(a)*.18*t*2,.6+t*.7,Math.sin(a)*.18*t*2);l.rotation.set(-.6-R()*.5,-a,0);l.castShadow=true;g.add(l)}
 g.position.set(x,0,z);g.scale.setScalar(s||1);scene.add(g);colliders.push({x1:x-.55,x2:x+.55,z1:z-.55,z2:z+.55});return g}

/* ---------- house ---------- */
plane(0,0,20,14,WOOD(52,6,4,{roughness:.4}),0);
plane(-6.5,-3.5,7,7,M(0xffffff,{map:carpetT('#e8c3d6',6,6),roughness:1}),.01);
plane(6.5,-3.5,7,7,M(0xffffff,{map:tileT(7,7),roughness:.25}),.01);
wall(-10,-7,10,-7,3);wall(-10,-7,-10,.2,3);wall(-10,2.2,-10,7,3);wall(10,-7,10,-2.4,3);wall(10,-.4,10,7,3);

wall(-3,-7,-3,-4.5);wall(-3,-2.5,-3,0);wall(-10,0,-3,0);wall(3,-7,3,-4.5);wall(3,-2.5,3,0);
for(const x of[-3,3])box(x,-3.5,.2,2,.5,0,{y:2.1,solid:false,mat:WOOD(35,1,1)});
const cv=document.createElement('canvas');cv.width=512;cv.height=128;const gg=cv.getContext('2d');
gg.fillStyle='#f9a8d4';gg.fillRect(0,0,512,128);gg.strokeStyle='#fff';gg.lineWidth=6;gg.strokeRect(6,6,500,116);gg.fillStyle='#4c1d95';gg.font='bold 54px system-ui';gg.textAlign='center';gg.textBaseline='middle';gg.fillText(NAME+'’s room ✨',256,66);
const sign=new THREE.Mesh(new THREE.PlaneGeometry(1.8,.45),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv)}));sign.position.set(-2.88,2.35,-3.5);sign.rotation.y=Math.PI/2;scene.add(sign);
const winMat=M(0x9ad1ff,{emissive:0x7ab8ff,emissiveIntensity:.6});
const win=new THREE.Mesh(new THREE.PlaneGeometry(3,1.5),winMat);win.position.set(0,1.7,-6.88);scene.add(win);
box(0,-6.85,3.3,.1,.12,0xffffff,{y:2.5,solid:false});box(0,-6.85,3.3,.1,.12,0xffffff,{y:.9,solid:false});
const curt=[-1,1].map(s=>{const c=box(s*1.9,-6.7,.9,.2,2.4,0xc4b5fd,{solid:false,mat:FAB(0xc4b5fd),r:.1});c.userData.x=s*1.9;return c});

/* bedroom */
box(-8.3,-5.3,2.3,3.1,.3,0,{mat:WOOD(30,1,1),r:.05});
const matt=box(-8.3,-5.3,2.2,3,.35,0xfbcfe8,{y:.3,mat:FAB(0xf9a8d4),r:.15,solid:false});
box(-8.3,-4.7,2.25,1.9,.12,0xa78bfa,{y:.6,solid:false,mat:FAB(0x8b5cf6),r:.05});
box(-8.3,-6.85,2.4,.2,1.4,0,{mat:FAB(0x7c3aed),r:.08});
box(-8.8,-6.2,.8,.5,.2,0xffffff,{y:.62,solid:false,mat:FAB(0xffffff),r:.09});box(-7.8,-6.2,.8,.5,.2,0xffffff,{y:.62,solid:false,mat:FAB(0xfde68a),r:.09});
box(-6.5,-6.5,.6,.6,.5,0,{mat:WOOD(40,1,1),r:.03});
const shadeM=M(0xfff1c9,{emissive:0xffd98a,emissiveIntensity:.9,side:THREE.DoubleSide,roughness:.9});
const lampBulb=lathe([[.12,0],[.22,.3],[.2,.3],[.1,.02]],-6.5,.5,-6.5,shadeM);
const lampLight=new THREE.PointLight(0xffd9a0,1,9);lampLight.position.set(-6.5,1.1,-6.3);scene.add(lampLight);
box(-4.5,-6.5,2,.8,2.4,0,{mat:WOOD(70,1,1),r:.03});box(-4.5,-6.08,.04,.02,2.1,0xcbb8f0,{y:.15,solid:false});
box(-9.2,-1.8,.9,2,.8,0,{mat:WOOD(65,1,1)});
box(-9.2,-1.8,.5,.6,.04,0x9ca3af,{y:.8,solid:false,m:{metalness:.7,roughness:.3}});
const lapScr=box(-9.45,-1.8,.04,.55,.38,0x1e1b4b,{y:.84,solid:false,m:{emissive:0x6366f1,emissiveIntensity:.5}});
box(-8.3,-1.8,.55,.55,.5,0,{mat:FAB(0xf472b6),r:.12});
box(-6,-.55,1.5,.5,.8,0,{mat:WOOD(75,1,1)});box(-6,-.3,1.1,.05,1.1,0xdbeafe,{y:.8,solid:false,m:{metalness:.9,roughness:.05}});
lathe([[.001,0],[.1,0],[.07,.15],[.05,.3],[.09,.4],[.001,.4]],-6.5,.8,-.55,M(0xbfdbfe,{roughness:.1,metalness:.3}));
box(-6.5,-3.5,3.4,2.6,.03,0,{y:.02,solid:false,mat:M(0xffffff,{map:carpetT('#c4b5fd',3,3),roughness:1})});
const easel=box(-3.9,-.7,.3,.3,.1,0,{solid:false,mat:WOOD(50,1,1)});
for(let i=0;i<14;i++)ball(-9.5+i*.45,2.35+Math.sin(i)*.12,-6.85,.06,0xfde68a,{emissive:0xfde68a,emissiveIntensity:1.4});

/* kitchen */
box(6.5,-6.6,6.2,.7,.9,0xf8fafc,{r:.02});box(6.5,-6.6,6.2,.72,.06,0,{y:.9,solid:false,mat:M(0x2b2f3a,{roughness:.15,metalness:.2})});
box(6.5,-2,3,1,.95,0,{mat:WOOD(40,2,1)});box(6.5,-2,3.2,1.2,.06,0xf8fafc,{y:.95,solid:false,m:{roughness:.15}});
box(9.3,-6.5,1,.9,2.1,0xcbd5e1,{r:.05,m:{metalness:.6,roughness:.3}});
box(4.3,-3.2,.5,.5,.5,0,{mat:FAB(0xef4444),r:.1});box(5.2,-3.2,.5,.5,.5,0,{mat:FAB(0xef4444),r:.1});
lathe([[.001,0],[.2,.02],[.3,.2],[.32,.22],[.001,.2]],6.5,1.01,-2,M(0xf1f5f9,{roughness:.2}));
for(const[x,c]of[[6.4,0xef4444],[6.55,0xf59e0b],[6.7,0x84cc16]])ball(x,1.2,-2,.07,c,{roughness:.4});
const kLight=new THREE.PointLight(0xffffff,.6,10);kLight.position.set(6.5,2.6,-3);scene.add(kLight);

/* living room */
box(-7.7,3.5,1.1,1.6,.4,0,{mat:WOOD(45,1,1),r:.04});plane(-7.5,3.5,4.4,4.4,M(0xffffff,{map:carpetT('#e9d5ff',4,4),roughness:1}),.015);
box(-5.8,3.5,1.1,3,.5,0,{mat:FAB(0x6366f1),r:.15});box(-5.15,3.5,.4,3,1.1,0,{mat:FAB(0x6366f1),r:.15});
box(-5.8,2.05,1.1,.35,.8,0,{mat:FAB(0x4f46e5),r:.15});box(-5.8,4.95,1.1,.35,.8,0,{mat:FAB(0x4f46e5),r:.15});
box(-5.6,2.9,.5,.5,.45,0,{y:.5,solid:false,mat:FAB(0xfbbf24),r:.2});box(-5.6,4.1,.5,.5,.45,0,{y:.5,solid:false,mat:FAB(0xf472b6),r:.2});
box(-9.5,3.5,.5,2.4,.5,0,{mat:WOOD(30,1,1)});
const tv=box(-9.72,3.5,.1,2,1.1,0x000000,{y:.9,solid:false,m:{emissive:0x000000,roughness:.1}});
box(9.6,3,.4,3,2.3,0,{mat:WOOD(35,1,2)});
for(let i=0;i<10;i++)box(9.35,1.8+i*.28,.2,.2+R()*.1,.22,new THREE.Color().setHSL(R(),.5,.45),{y:0,solid:false});
const tab=box(5,4.6,2.6,1.4,.8,0,{mat:WOOD(55,2,1),r:.04});
[[3.4,4.6],[6.6,4.6],[5,3.4]].forEach(p=>box(p[0],p[1],.5,.5,.5,0,{solid:false,mat:FAB(0x6366f1),r:.1}));
lathe([[.001,0],[.12,0],[.18,.2],[.1,.4],[.07,.55],[.12,.62],[.001,.6]],5,.8,4.6,M(0x38bdf8,{roughness:.1,metalness:.2}));
leafPlant(-9.2,6.2,0xb45309,1.3);const plant2=leafPlant(9.2,-3.4,0xe5e7eb,.9);
box(1.5,0,.6,.6,.7,0x1f2937,{r:.05});
/* piano */
box(7.6,6,2,1.3,.85,0x0f0f14,{r:.05,m:{roughness:.15,metalness:.1}});
const keysT=tex(256,64,(g,w,h)=>{g.fillStyle='#fafafa';g.fillRect(0,0,w,h);for(let i=0;i<16;i++){g.fillStyle='#999';g.fillRect(i*16,0,1,h);if(i%7!=2&&i%7!=6&&i%7!=0){g.fillStyle='#111';g.fillRect(i*16-4,0,8,36)}}});
box(7.6,5.25,1.8,.3,.04,0,{y:.86,solid:false,mat:M(0xffffff,{map:keysT,roughness:.3})});

anim.push(()=>{const px=driving?pcar.x:P.x,pz=driving?pcar.z:P.z,s=.45,W=mc.width,H=mc.height;mg.fillStyle='#2f3b2f';mg.fillRect(0,0,W,H);mg.fillStyle='#454a52';
 for(const xr of RXs)mg.fillRect((xr-6-px)*s+W/2,(24-pz)*s+H/2,12*s,372*s);for(const zr of RZs)mg.fillRect((-266-px)*s+W/2,(zr-6-pz)*s+H/2,532*s,12*s);
 mg.fillStyle='#d9d2c5';mg.fillRect((-46-px)*s+W/2,(-7-pz)*s+H/2,92*s,21*s);mg.fillStyle='#ef4444';mg.beginPath();mg.arc((pcar.x-px)*s+W/2,(pcar.z-pz)*s+H/2,4,0,7);mg.fill();mg.fillStyle='#fff';mg.beginPath();mg.arc(W/2,H/2,4,0,7);mg.fill()});
/* sky: stars and clouds */
{const n=700,pos=new Float32Array(n*3);for(let i=0;i<n;i++){const a=R()*6.283,e=Math.acos(R()*.95),r=600;pos[i*3]=r*Math.sin(e)*Math.cos(a);pos[i*3+1]=r*Math.cos(e);pos[i*3+2]=r*Math.sin(e)*Math.sin(a)}
 const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(pos,3));const stp=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false,fog:false}));scene.add(stp);
 const cm=M(0xffffff,{roughness:1,fog:false}),cg=new THREE.Group();for(let i=0;i<40;i++){const c=new THREE.Group();for(let k=0;k<4;k++){const s=new THREE.Mesh(new THREE.SphereGeometry(8+R()*8,8,6),cm);s.scale.y=.45;s.position.set(k*10-15,R()*4,R()*8);c.add(s)}c.position.set((R()-.5)*600,110+R()*40,R()*420);cg.add(c)}scene.add(cg);
 anim.push((t)=>{const out=driving||P.z>15;stp.visible=night&&out;stp.position.copy(camera.position);cg.visible=!night&&out;cg.position.x=((t*2)%200)-100})}
/* traffic lights */
{const ni=RXs.length*RZs.length*2,pm=new THREE.InstancedMesh(new THREE.CylinderGeometry(.06,.07,3.6,6),M(0x2b2f3a),ni),hm=new THREE.InstancedMesh(new THREE.BoxGeometry(.3,.9,.3),M(0x15171c),ni),lm=new THREE.InstancedMesh(new THREE.SphereGeometry(.09,8,6),new THREE.MeshBasicMaterial({color:0xffffff}),ni*3),mm=new THREE.Matrix4(),cc=new THREE.Color();let a=0,b=0;
 for(const xr of RXs)for(const zr of RZs)for(const s of[1,-1]){const x=xr+s*6.6,z=zr-s*6.6,lit=Math.floor(R()*3);mm.setPosition(x,1.8,z);pm.setMatrixAt(a,mm);mm.setPosition(x,3.9,z);hm.setMatrixAt(a++,mm);for(let k=0;k<3;k++){mm.setPosition(x,4.2-k*.3,z+(s>0?.17:-.17));lm.setMatrixAt(b,mm);lm.setColorAt(b++,cc.setHex(k===lit?[0xff3b30,0xffcc00,0x34c759][k]:0x222222))}}
 scene.add(pm,hm,lm)}
})();
/* ---------- input & loop ---------- */
const keys={w:0,a:0,s:0,d:0},map={arrowup:'w',arrowleft:'a',arrowdown:'s',arrowright:'d'};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(gameOpen){if(k==='escape')closeGame();else if(gKeyHook)gKeyHook(k,1);e.preventDefault();return}if(k==='q'){drop();return}if(k==='e'||k===' '||k==='enter'){doAct();e.preventDefault();return}if(k==='f'){doAct2();return}const m=map[k]||k;if(m in keys)keys[m]=1});
addEventListener('keyup',e=>{const k=e.key.toLowerCase(),m=map[k]||k;if(gameOpen&&gKeyHook)gKeyHook(k,0);if(m in keys)keys[m]=0});
document.querySelectorAll('.pad button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=0))});
function blocked(x,z,pad){pad=pad||0;if(z<-6.6||(z<13.9?(x<-45.6||x>45.6):(x<-268||x>268||z>396)))return true;for(const c of colliders)if(x>c.x1-pad+.2&&x<c.x2+pad-.2&&z>c.z1-pad+.2&&z<c.z2+pad-.2)return true;return false}
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let walkT=0;camera.position.set(P.x,10,P.z+7);
function frame(){requestAnimationFrame(frame);
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 const nm=gameOpen||driving;let dx=nm?0:keys.d-keys.a,dz=nm?0:keys.s-keys.w;const moving=dx||dz;
 if(moving){const l=Math.hypot(dx,dz);dx=dx/l*4.2*dt;dz=dz/l*4.2*dt;if(!blocked(P.x+dx,P.z))P.x+=dx;if(!blocked(P.x,P.z+dz))P.z+=dz;me.rotation.y=Math.atan2(dx,dz);walkT+=dt*11;dancing=0}else walkT=0;
 let sw=moving?Math.sin(walkT)*.6:0;
 if(dancing>0){dancing-=dt;me.rotation.y+=dt*6;sw=Math.sin(t*14)*.8;armL.rotation.z=-1.2;armR.rotation.z=1.2}else{armL.rotation.z=0;armR.rotation.z=0}
 legL.rotation.x=sw;legR.rotation.x=-sw;if(!dancing>0){armL.rotation.x=-sw;armR.rotation.x=sw}
 me.position.set(P.x,(moving||dancing>0)?Math.abs(Math.sin(walkT||t*14))*.06:0,P.z);
 /* pets wander */
 for(const p of pets){const g=p.g;p.t+=dt;let mv=0;
  if(p.wait>0)p.wait-=dt;else{const ddx=p.tx-g.position.x,ddz=p.tz-g.position.z,d=Math.hypot(ddx,ddz);
   if(d<.15){p.wait=1+R()*4;p.tx=clamp(g.position.x+(R()-.5)*7,-9,9);p.tz=clamp(g.position.z+(R()-.5)*7,-6,12.5)}
   else{const nx=g.position.x+ddx/d*p.speed*dt,nz=g.position.z+ddz/d*p.speed*dt;
    if(!blocked(nx,nz,-.1)){g.position.x=nx;g.position.z=nz;mv=1;g.rotation.y+=(Math.atan2(-ddz,ddx)-g.rotation.y+Math.PI*3)%(Math.PI*2)*0+0;g.rotation.y=Math.atan2(-ddz,ddx)}else{p.wait=.3;p.tx=g.position.x+(R()-.5)*4;p.tz=g.position.z+(R()-.5)*4}}}
  p.legs.forEach((l,i)=>l.rotation.z=mv?Math.sin(p.t*10*Math.min(p.speed,2)+(i%2?0:Math.PI))*.7:0);
  p.tail.rotation.y=Math.sin(p.t*8)*.5;g.position.y=mv&&p.name==='Hop'?Math.abs(Math.sin(p.t*9))*.12:0;p.head.rotation.z=mv?0:Math.sin(p.t*1.5)*.08}
 parrot.position.y=.95+Math.sin(t*3)*.01;parrot.rotation.y=Math.sin(t*.6)*.5;
 fish.forEach((f,i)=>{const a=t*(.6+i*.2)+i*2;f.position.set(-1.5+Math.cos(a)*.65,.95+Math.sin(a*1.3)*.18+i*.05,6.2+Math.sin(a)*.22);f.rotation.y=-a+Math.PI/2*(Math.sin(a)>0?1:-1)*0-Math.PI/2*0+Math.PI})
 if(!driving){camera.position.x+=(P.x-camera.position.x)*.08;camera.position.z+=(P.z+7-camera.position.z)*.08;camera.position.y=10;camera.lookAt(camera.position.x,0,camera.position.z-7)}
 if(tvOn)tv.material.emissive.setHSL((t*(.1+tvCh*.15))%1,.7,.4+.1*Math.sin(t*5));
 lapScr.material.emissiveIntensity=.4+Math.sin(t*2)*.15;
 let best=null,bd=1e9;for(const it of items){if(it.held)continue;const q=ipos(it),d=Math.hypot(P.x-q.x,P.z-q.z)-(it.bias||(it.pick?.5:0));if(d<it.r&&d<bd){bd=d;best=it}}
 near=best;if(best){act.style.display='inline-block';act.textContent=best.label()+' (E)';if(best.fn2){act2.style.display='inline-block';act2.textContent=best.label2()+' (F)'}else act2.style.display='none'}else{act.style.display='none';act2.style.display='none'}
 anim.forEach(f=>f(t,dt));renderer.render(scene,camera)}
frame();
